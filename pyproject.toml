[tool.mypy]
python_version = "3.11"
show_error_codes = true
check_untyped_defs = true
warn_unused_configs = true
ignore_missing_imports = true

# Tests use unittest.mock and hamcrest extensively — Mock/AsyncMock
# patterns and hamcrest matchers trigger false positives.
[[tool.mypy.overrides]]
module = ["*.tests.*", "integration_tests.*"]
disable_error_code = ["method-assign", "attr-defined", "arg-type"]

# Bulk write/read surface added by the presence-init reconcile refactor.
# Keep it fully typed: any annotated def here must be complete.
[[tool.mypy.overrides]]
module = [
    "wazo_chatd.database.helpers",
    "wazo_chatd.database.queries.user",
    "wazo_chatd.database.queries.line",
    "wazo_chatd.database.queries.session",
    "wazo_chatd.database.queries.refresh_token",
    "wazo_chatd.database.queries.tenant",
    "wazo_chatd.database.queries.endpoint",
    "wazo_chatd.database.queries.channel",
]
disallow_incomplete_defs = true

[tool.black]
skip-string-normalization = true

[tool.flake8]
show-source = true
max-line-length = 99
application-import-names = "wazo_chatd"
ignore = [
  "E203", # whitespace before ':'
  "E501", # line too long (80 chars)
  "W503", # line break before binary operator
]
exclude = [
    ".tox",
    ".eggs",
    "alembic/*",
]

[tool.isort]
profile = "black"
py_version = 311

[tool.coverage.paths]
source = [
  "wazo_chatd",
  "/usr/src/wazo-chatd/wazo_chatd",
]

[tool.coverage.run]
omit = [
  "*/test-connector/*",
  "*/test_connector/*",
]

[tool.pytest]
testpaths = ["wazo_chatd"]
